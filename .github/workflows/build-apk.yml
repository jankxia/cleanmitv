# Build the launcher APK on GitHub's own runners (JDK + Android SDK included),
# so the repo can be verified and an installable APK produced without a local SDK.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      launcherApplicationId:
        description: 'Package name override for MiTV OS3/OS2 allowlist builds (e.g. com.ts.launcher). Leave empty for the default com.gathin.tvhome.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Restore signing key
        env:
          TVHOME_KEYSTORE_B64: ${{ secrets.TVHOME_KEYSTORE_B64 }}
        run: |
          if [ -n "$TVHOME_KEYSTORE_B64" ]; then
            echo "$TVHOME_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvhome.p12"
            echo "TVHOME_STORE=$RUNNER_TEMP/tvhome.p12" >> "$GITHUB_ENV"
            echo "Signing with the fixed key: an in-place adb install upgrade keeps working."
          else
            echo "::warning::TVHOME_KEYSTORE_B64 is unset — falling back to the runner's debug key, which changes on every run and breaks in-place upgrades."
          fi

      - name: Build release APK
        run: |
          SIGN_ARGS=""
          if [ -n "$TVHOME_STORE" ]; then SIGN_ARGS="-PtvhomeStoreFile=$TVHOME_STORE"; fi
          if [ -n "${{ inputs.launcherApplicationId }}" ]; then
            ./gradlew assembleRelease -PlauncherApplicationId=${{ inputs.launcherApplicationId }} $SIGN_ARGS --no-daemon --console=plain
          else
            ./gradlew assembleRelease $SIGN_ARGS --no-daemon --console=plain
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-app-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
