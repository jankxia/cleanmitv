plugins {
    id 'com.android.application'
}

// The APK is sideloaded over ADB and updated in place, so every build must carry the same signature
// or the TV refuses the upgrade ("signatures do not match"). CI restores one fixed PKCS12 key from
// the TVHOME_KEYSTORE_B64 repo secret and passes its path as -PtvhomeStoreFile; without that
// property (a fresh fork) the runner's own debug key is used instead.
def tvhomeStore = providers.gradleProperty('tvhomeStoreFile').getOrNull()

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    signingConfigs {
        tvhome {
            if (tvhomeStore) {
                storeFile file(tvhomeStore)
                storePassword 'android'
                keyAlias 'tvhome'
                keyPassword 'android'
                storeType 'PKCS12'
            }
        }
    }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName '2.8.7-pin-every-choice'
        resConfigs 'en', 'zh-rCN'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the fixed key when CI provides one,
            // otherwise with the debug key (that one changes on every runner, so installs collide).
            signingConfig(tvhomeStore ? signingConfigs.tvhome : signingConfigs.debug)
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
